<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp Calling</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --line: #eceef1;
    --purple: #6f3dbf;
    --green: #04943a;
    --blue: #1e88ff;
    --ok-bg: #e6f6ec;  --ok-text: #14602f;
    --err-bg: #fff1c9; --err-text: #7a4b00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.08);
  }
  h1 { font-size: 22px; margin: 0 0 14px; }
  h2 { font-size: 18px; margin: 22px 0 6px; }
  label.field { display: block; font-weight: 700; font-size: 17px; margin: 14px 0 6px; }
  input[type=text], select {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #d5d8dd;
    border-radius: 6px;
    background: #fff;
    color: var(--text);
  }
  select { background: #ececf0; }
  button, a.btn {
    display: block;
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 6px;
    font-size: 16px;
    color: #fff;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: default; }
  #findBtn { background: var(--purple); margin-top: 16px; }
  #submitBtn { background: var(--blue); margin-top: 18px; }
  a.call { background: var(--green); font-size: 20px; font-weight: 700; padding: 15px; margin-top: 12px; }
  .person {
    background: #f1f3f5;
    border-radius: 8px;
    padding: 18px 16px 20px;
    margin-top: 16px;
    text-align: center;
  }
  .person .hint { font-size: 18px; }
  .person .number { font-size: 26px; font-weight: 700; margin-top: 8px; letter-spacing: 0.5px; }
  .person .note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .status-list { margin: 0; padding: 0; }
  .status-list label {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 4px;
    border-bottom: 1px solid var(--line);
    font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  .status-list input { width: 18px; height: 18px; accent-color: var(--blue); }
  .msg { margin-top: 14px; padding: 14px; border-radius: 6px; font-size: 16px; display: none; }
  .msg.ok  { display: block; background: var(--ok-bg);  color: var(--ok-text); }
  .msg.err { display: block; background: var(--err-bg); color: var(--err-text); }
  .opt { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; color: var(--muted); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>WhatsApp Calling</h1>

    <label class="field" for="caller">Caller Name</label>
    <input type="text" id="caller" autocomplete="name" placeholder="Your name">

    <label class="field" for="city">Select City</label>
    <select id="city"><option value="">Loading cities…</option></select>

    <button id="findBtn" type="button">Find Next Person</button>

    <div class="opt">
      <input type="checkbox" id="autoNext" checked>
      <label for="autoNext">Load the next number automatically after submitting</label>
    </div>

    <div id="person" class="person hidden">
      <div class="hint">Next person to call</div>
      <div class="number" id="number"></div>
      <a class="btn call" id="callBtn" href="#">📞 Call</a>
      <div class="note" id="reserveNote"></div>
    </div>

    <!-- only visible while a number is loaded -->
    <div id="statusSection" class="hidden">
      <h2>Calling Status</h2>
      <div class="status-list" id="statusList"></div>
      <button id="submitBtn" type="button" disabled>Submit Status</button>
    </div>

    <div id="msg" class="msg"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
(function () {
  'use strict';

  const API = String(window.APP_CONFIG.API_URL || '').replace(/\/+$/, '');

  const $ = id => document.getElementById(id);
  const el = {
    caller: $('caller'), city: $('city'), find: $('findBtn'), submit: $('submitBtn'),
    person: $('person'), number: $('number'), call: $('callBtn'), note: $('reserveNote'),
    statusList: $('statusList'), statusSection: $('statusSection'), msg: $('msg'), autoNext: $('autoNext')
  };

  let current = null;   // { id, city, number } reserved for this caller
  let busy = false;
  let reservationMinutes = 10;

  /* ---------- helpers ---------- */

  function store(key, value) {
    try {
      if (value === undefined) return localStorage.getItem(key);
      localStorage.setItem(key, value);
    } catch (e) { return null; }
  }

  function clientId() {
    let id = store('wc_client_id');
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2))
        .replace(/[^A-Za-z0-9_-]/g, '');
      store('wc_client_id', id);
    }
    return id;
  }

  function show(text, kind) {
    el.msg.textContent = text;
    el.msg.className = 'msg ' + (kind || 'ok');
  }
  function hideMsg() { el.msg.className = 'msg'; el.msg.textContent = ''; }

  async function api(path, body) {
    const headers = { 'Content-Type': 'application/json' };
    const pass = store('wc_passcode');
    if (pass) headers['X-Passcode'] = pass;

    for (let attempt = 0; attempt < 2; attempt++) {
      let res;
      try {
        res = await fetch(API + path, {
          method: body ? 'POST' : 'GET',
          headers,
          body: body ? JSON.stringify(body) : undefined
        });
      } catch (e) {
        throw new Error('Could not reach the server. Check your internet and try again.');
      }

      let data = {};
      try { data = await res.json(); } catch (e) {}

      if (res.status === 401 && attempt === 0) {
        const entered = window.prompt('Enter the calling passcode');
        if (!entered) throw new Error('Passcode required.');
        store('wc_passcode', entered.trim());
        headers['X-Passcode'] = entered.trim();
        continue;
      }
      if (!res.ok) throw new Error(data.error || 'Request failed (' + res.status + ').');
      return data;
    }
  }

  function setBusy(state) {
    busy = state;
    el.find.disabled = state;
    el.submit.disabled = state || !current;
  }

  /* ---------- cities ---------- */

  async function loadCities(keepSelection) {
    const wanted = keepSelection ? el.city.value : '';
    const data = await api('/api/cities');
    el.city.innerHTML = '';

    const first = document.createElement('option');
    first.value = '';
    first.textContent = data.cities.length ? 'Select city' : 'No pending numbers left';
    el.city.appendChild(first);

    data.cities.forEach(c => {
      const o = document.createElement('option');
      o.value = c.city;
      o.textContent = c.city + '  (' + c.pending.toLocaleString() + ' left)';
      el.city.appendChild(o);
    });

    if (wanted) {
      const still = [...el.city.options].some(o => o.value === wanted);
      el.city.value = still ? wanted : '';
    } else {
      const last = store('wc_city');
      if (last && [...el.city.options].some(o => o.value === last)) el.city.value = last;
    }
  }

  /* ---------- statuses ---------- */

  function renderStatuses(list) {
    el.statusList.innerHTML = '';
    list.forEach((s, i) => {
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'status';
      input.value = s;
      input.id = 'st' + i;
      label.appendChild(input);
      label.appendChild(document.createTextNode(s));
      el.statusList.appendChild(label);
    });
  }

  function selectedStatus() {
    const r = document.querySelector('input[name=status]:checked');
    return r ? r.value : '';
  }
  function clearStatus() {
    const r = document.querySelector('input[name=status]:checked');
    if (r) r.checked = false;
  }

  /* ---------- person card ---------- */

  function setPerson(p) {
    current = p;
    if (p) {
      el.number.textContent = p.number;
      el.call.href = 'tel:' + p.number;
      el.note.textContent = 'Reserved for you for ' + reservationMinutes + ' minutes.';
      el.person.classList.remove('hidden');
    } else {
      el.person.classList.add('hidden');
      el.number.textContent = '';
    }
    // The status options only exist while there is a number to give a status to.
    el.statusSection.classList.toggle('hidden', !p);
    el.submit.disabled = busy || !current;
  }

  /* ---------- actions ---------- */

  async function findNext() {
    hideMsg();
    const name = el.caller.value.trim();
    const city = el.city.value;

    if (!name) return show('Please enter the caller name.', 'err');
    if (!city) return show('Please select a city.', 'err');

    store('wc_caller', name);
    store('wc_city', city);
    setBusy(true);
    try {
      const data = await api('/api/next', { city, clientId: clientId() });
      clearStatus();
      if (!data.person) {
        setPerson(null);
        show('No pending numbers left in ' + city + '.', 'err');
        await loadCities(false);
      } else {
        setPerson(data.person);
      }
    } catch (e) {
      show(e.message, 'err');
    } finally {
      setBusy(false);
    }
  }

  async function submitStatus() {
    hideMsg();
    const name = el.caller.value.trim();
    const status = selectedStatus();

    if (!current) return show('No valid calling record is selected.', 'err');
    if (!name) return show('Caller name is required.', 'err');
    if (!status) return show('Please select a Calling Status.', 'err');

    setBusy(true);
    let saved = false;
    try {
      const data = await api('/api/submit', {
        id: current.id,
        number: current.number,
        callerName: name,
        status,
        clientId: clientId()
      });
      saved = true;
      show(data.message || 'Status saved successfully ✓', 'ok');
      setPerson(null);
      clearStatus();
    } catch (e) {
      show(e.message, 'err');
      // If the number is gone or taken, drop it so the caller can fetch a fresh one.
      if (/find the next person/i.test(e.message)) { setPerson(null); clearStatus(); }
    } finally {
      setBusy(false);
    }

    if (saved) {
      try { await loadCities(true); } catch (e) {}
      if (el.autoNext.checked && el.city.value) {
        const okText = el.msg.textContent;
        await findNext();
        if (current) show(okText, 'ok'); // keep the "saved" confirmation visible
      }
    }
  }

  /* ---------- start ---------- */

  el.find.addEventListener('click', findNext);
  el.submit.addEventListener('click', submitStatus);
  el.city.addEventListener('change', () => { setPerson(null); clearStatus(); hideMsg(); });
  el.autoNext.checked = store('wc_auto') !== '0';
  el.autoNext.addEventListener('change', () => store('wc_auto', el.autoNext.checked ? '1' : '0'));
  el.caller.value = store('wc_caller') || '';

  (async function init() {
    try {
      const [cfg] = await Promise.all([api('/api/config'), loadCities(false)]);
      reservationMinutes = cfg.reservationMinutes || 10;
      renderStatuses(cfg.statuses);
    } catch (e) {
      el.city.innerHTML = '<option value="">Could not load</option>';
      show(e.message, 'err');
    }
  })();
})();
</script>
</body>
</html>
